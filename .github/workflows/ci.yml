name: CI

# Run on pushes to the default branch and on every pull request.
# Feature branches are covered by their pull request run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: the jobs only need to check out the code.
permissions:
  contents: read

# Cancel in-progress runs when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # git-oups has no runtime dependency; pytest is only needed to run the suite.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run the test suite
        run: python -m pytest -q
